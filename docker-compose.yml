services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buena_properties
      POSTGRES_USER: buena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buena -d buena_properties"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: /srv/buena/buena-property-management/backend
    environment:
      DATABASE_URL: postgresql://buena:${POSTGRES_PASSWORD}@postgres:5432/buena_properties
      FRONTEND_URL: ${FRONTEND_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: /srv/buena/buena-property-management/frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
